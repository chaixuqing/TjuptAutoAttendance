[Bot]
base-url = https://www.tjupt.org/
cookies-path = data/cookies.pkl
douban-path = data/douban.json
username = UserName
password = Password

# Optional: an OpenAI-compatible endpoint. Leave llm-api-key empty to disable the LLM.
# It is used for two things, and only when Douban fails:
#   1. llm-model        - rewrites a fuzzy captcha label into a query Douban can resolve.
#   2. llm-vision-model - reads the poster image itself; must be a multimodal model id
#                         (text-only ids such as deepseek-ai/DeepSeek-V4-Pro-0813 cannot).
# On GitHub Actions, prefer the LLM_API_KEY *secret* over putting it in this file.
llm-api-url = https://api-inference.modelscope.cn/v1
llm-api-key =
llm-model = deepseek-ai/DeepSeek-V4-Pro-0813
llm-vision-model =
# llm-vision-model = Qwen/Qwen3.8-Flash-Next
llm-refine = on
llm-timeout = 30
llm-cache-path = data/llm.json
