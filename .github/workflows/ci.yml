name: CI

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyyaml
    - name: Validate workflow files
      run: |
        python - <<'PY'
        import glob, sys, yaml
        for path in sorted(glob.glob(".github/workflows/*.y*ml")):
          with open(path, encoding="utf-8") as f:
            yaml.safe_load(f)
          print("valid:", path)
        PY
    - name: Check that credentials stay off the command line
      run: |
        if grep -RInE 'main\.py .*-(u|p)[= ]' .github/workflows/; then
          echo "::error::secrets must be passed via env, never as arguments (they end up in the process list)"
          exit 1
        fi
    - name: Run tests
      run: python -m unittest discover -s tests -t . -v
