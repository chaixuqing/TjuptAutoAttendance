name: Auto Attendance

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Cache Data
      id: cache-tjupt-attendance-data
      uses: actions/cache@v6
      with:
        path: data
        key: ${{ runner.os }}-data
      continue-on-error: true
    - name: Check secrets
      if: ${{ secrets.USERNAME == '' || secrets.PASSWORD == '' }}
      run: echo "::warning::The USERNAME and/or PASSWORD secret is not configured, so attendance cannot be performed. Set both in Settings -> Secrets and variables -> Actions."
    - name: Auto Attendance
      run: |
        python main.py -u "${{ secrets.USERNAME }}" -p "${{ secrets.PASSWORD }}"
      continue-on-error: true
