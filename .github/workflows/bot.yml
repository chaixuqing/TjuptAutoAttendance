name: Auto Attendance

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Cache Data
      id: cache-tjupt-attendance-data
      uses: actions/cache@v6
      with:
        path: data
        key: ${{ runner.os }}-data
      continue-on-error: true
    - name: Check secrets
      env:
        TJUPT_USERNAME: ${{ secrets.USERNAME }}
        TJUPT_PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        if [ -z "$TJUPT_USERNAME" ] || [ -z "$TJUPT_PASSWORD" ]; then
          echo "::warning::..."
        fi
    - name: Auto Attendance
      env:
        TJUPT_USERNAME: ${{ secrets.USERNAME }}
        TJUPT_PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        python main.py -u "$TJUPT_USERNAME" -p "$TJUPT_PASSWORD"
