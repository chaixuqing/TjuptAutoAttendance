name: Auto Attendance

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Cache Data
      id: cache-tjupt-attendance-data
      uses: actions/cache@v6
      with:
        path: data
        # A cache entry is immutable, so a fixed key would restore the very first
        # upload forever and never save the refreshed cookies / Douban lookups.
        # A per-run key plus a prefix restore gives an append-only cache instead.
        key: ${{ runner.os }}-data-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-data-
      continue-on-error: true
    - name: Check secrets
      env:
        TJUPT_USERNAME: ${{ secrets.USERNAME }}
        TJUPT_PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        if [ -z "$TJUPT_USERNAME" ] || [ -z "$TJUPT_PASSWORD" ]; then
          echo "::error::Repository secrets USERNAME and/or PASSWORD are not set. Add them under Settings -> Secrets -> Actions."
          exit 1
        fi
    - name: Auto Attendance
      env:
        TJUPT_USERNAME: ${{ secrets.USERNAME }}
        TJUPT_PASSWORD: ${{ secrets.PASSWORD }}
        # Optional LLM fallback, used only when Douban cannot resolve an option.
        # The key is a secret; the rest are ordinary repository variables, so a fork
        # with nothing configured simply keeps the Douban-only behaviour.
        TJUPT_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        TJUPT_LLM_API_URL: ${{ vars.LLM_API_URL }}
        TJUPT_LLM_MODEL: ${{ vars.LLM_MODEL }}
        TJUPT_LLM_VISION_MODEL: ${{ vars.LLM_VISION_MODEL }}
      # main.py reads the credentials from the environment, so they never appear on
      # the command line (where they would show up in the runner's process list and in
      # the step's command echo). A non-zero exit code from main.py fails this step.
      run: python main.py
